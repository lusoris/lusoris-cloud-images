[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lusoris-cloud-images"
version = "1.0.0"
description = "Enterprise-grade cloud and bare-metal OS image forge"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.22.0",
    "requests>=2.32.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.codespell]
skip = ".git,output-images,packer_cache,*.qcow2,*.img,*.lock,.pytest_cache,*.zst,*.iso"
ignore-words-list = "nts,ptb,vainfo,clinfo,amdgpu,radeonsi,cgroup,cgroups,cgroupfs,containerd,virtio,virtiofs,unraid,resolute,nd,renderd,te,hart"
