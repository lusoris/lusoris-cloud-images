[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.codespell]
skip = ".git,output-images,packer_cache,*.qcow2,*.img,*.lock,.pytest_cache,*.zst,*.iso"
ignore-words-list = "nts,ptb,vainfo,clinfo,amdgpu,radeonsi,cgroup,cgroups,cgroupfs,containerd,virtio,virtiofs,unraid,resolute,nd,renderd,te,hart,hindsight"
