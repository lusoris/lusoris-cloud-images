# tests/compliance/goss.yaml — Declarative Dynamic Compliance-as-Code Profile
# Validates CIS Benchmark Level 2, DISA STIG, and NIST SP 800-53 controls on booted images.
# Compatible with Goss (https://github.com/goss-org/goss) - evaluates in < 1s.

kernel-param:
  kernel.randomize_va_space:
    value: "2"
  kernel.dmesg_restrict:
    value: "1"
  kernel.kptr_restrict:
    value: "2"
  kernel.yama.ptrace_scope:
    value: "1"
  fs.suid_dumpable:
    value: "0"
  fs.protected_hardlinks:
    value: "1"
  fs.protected_symlinks:
    value: "1"
  fs.protected_fifos:
    value: "2"
  fs.protected_regular:
    value: "2"
  net.core.bpf_jit_harden:
    value: "2"
  net.ipv4.tcp_syncookies:
    value: "1"
  net.ipv4.conf.all.rp_filter:
    value: "1"
  net.ipv4.conf.default.rp_filter:
    value: "1"
  net.ipv4.conf.all.accept_redirects:
    value: "0"
  net.ipv4.conf.default.accept_redirects:
    value: "0"
  net.ipv4.conf.all.send_redirects:
    value: "0"
  net.ipv4.icmp_echo_ignore_broadcasts:
    value: "1"

file:
  /etc/ssh/sshd_config.d/00-hardened-sshd.conf:
    exists: true
    mode: "0600"
    owner: root
    group: root
    contents:
      - "PermitRootLogin no"
      - "MaxAuthTries 3"
      - "MaxSessions 2"
      - "PubkeyAuthentication yes"
      - "ClientAliveInterval 300"
      - "ClientAliveCountMax 0"
      - "X11Forwarding no"
      - "TrustedUserCAKeys /etc/ssh/trusted-user-ca-keys.pub"
      - "PasswordAuthentication no"
      - "chacha20-poly1305@openssh.com"

  /etc/ssh/trusted-user-ca-keys.pub:
    exists: true
    mode: "0644"
    owner: root
    group: root

  /etc/systemd/coredump.conf.d/00-disable.conf:
    exists: true
    owner: root
    contents:
      - "Storage=none"
      - "ProcessSizeMax=0"

  /etc/modprobe.d/blacklist-uncommon.conf:
    exists: true
    owner: root
    contents:
      - "install cramfs /bin/true"
      - "install freevxfs /bin/true"
      - "install jffs2 /bin/true"
      - "install hfs /bin/true"
      - "install hfsplus /bin/true"

  /etc/cloud/cloud.cfg.d/90_dpkg.cfg:
    exists: true
    owner: root
    contents:
      - "datasource_list: [ NoCloud, ConfigDrive, None ]"

service:
  fstrim.timer:
    enabled: true
    running: true

  qemu-guest-agent:
    enabled: true
