name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            code:
              - 'packer/**'
              - 'tests/**'
              - 'versions.json'
              - 'Makefile'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/required-aggregator.yml'
              - '.yamllint.yml'
              - '.codespellrc'

  lint:
    name: Lint & Static Gates
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-packer@1aa358be5cf73883762b302a3a03abd66e75b232 # v3.1.0
        with:
          version: "1.11.2"
      - name: Install Linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint shfmt
          pip install codespell tomli
      - name: Initialize Packer
        run: |
          cd packer
          packer init .
      - name: Check Packer Formatting
        run: |
          cd packer
          packer fmt -check .
      - name: Validate Packer Configuration
        run: |
          cd packer
          packer validate .
      - name: ShellCheck Provisioners
        run: shellcheck packer/provisioners/*.sh
      - name: Check Shell Formatting (shfmt)
        run: shfmt -d -i 2 -ci packer/provisioners/*.sh
      - name: Codespell Check
        run: codespell
      - name: Yamllint Check
        run: yamllint -c .yamllint.yml .github/ packer/http/

  test:
    name: Pytest Verification Suite
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-packer@1aa358be5cf73883762b302a3a03abd66e75b232 # v3.1.0
        with:
          version: "1.11.2"
      - name: Install Test Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          cd packer && packer init . && cd ..
          pip install pytest jsonschema
      - name: Run Test Suite
        run: pytest tests/ -v

  gitleaks:
    name: Secret & Privacy Leak Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
